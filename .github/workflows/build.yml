name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build SwiftFind (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK (for restore helpers)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        working-directory: src/SwiftFind.App
        run: |
          msbuild SwiftFind.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:m

      - name: Locate output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "SwiftFind.exe" | Select-Object -First 1
          if (-not $exe) { throw "SwiftFind.exe not found after build" }
          Write-Host "Found: $($exe.FullName)"
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Stage release package
        shell: pwsh
        run: |
          $stage = "release-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Main binary
          Copy-Item "${{ steps.locate.outputs.exe_path }}" "$stage/SwiftFind.exe"

          # Config if present
          $cfg = Join-Path "${{ steps.locate.outputs.exe_dir }}" "SwiftFind.exe.config"
          if (Test-Path $cfg) { Copy-Item $cfg "$stage/" }

          # Icon
          if (Test-Path "assets/SwiftFind.ico") {
            Copy-Item "assets/SwiftFind.ico" "$stage/"
          }

          # README
          if (Test-Path "README.md") { Copy-Item "README.md" "$stage/" }

          # Portable marker (optional convenience)
          "" | Out-File -FilePath "$stage/SwiftFind.portable" -Encoding ascii

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "release-package\*" -DestinationPath "SwiftFind-windows-x64.zip" -Force
          Get-Item "SwiftFind-windows-x64.zip" | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftFind-windows-x64
          path: |
            SwiftFind-windows-x64.zip
            release-package/SwiftFind.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwiftFind-windows-x64.zip
            release-package/SwiftFind.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: also produce a portable folder artifact
  package-info:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Summary
        run: |
          echo "### SwiftFind build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: **SwiftFind-windows-x64**" >> $GITHUB_STEP_SUMMARY
          echo "- Download from the Actions run or from Releases (when tagged)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To publish a release, push a tag:" >> $GITHUB_STEP_SUMMARY
          echo "\`git tag v2.6.0 && git push origin v2.6.0\`" >> $GITHUB_STEP_SUMMARY
