name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build and test (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet run --project tests/SwiftFind.Tests/SwiftFind.Tests.csproj -c Release

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') -replace '-.*$','' }
          else { $v = (Select-Xml -Path src/SwiftFind.App/SwiftFind.csproj -XPath '//Version').Node.InnerText }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build (Release)
        run: >
          dotnet build src/SwiftFind.App/SwiftFind.csproj -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          --nologo

      - name: Stage release package
        shell: pwsh
        run: |
          $bin = "src/SwiftFind.App/bin/Release/net48"
          if (-not (Test-Path "$bin/SwiftFind.exe")) { throw "SwiftFind.exe not found in $bin" }
          $stage = "release-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$bin/SwiftFind.exe" "$stage/SwiftFind.exe"
          if (Test-Path "$bin/SwiftFind.exe.config") { Copy-Item "$bin/SwiftFind.exe.config" "$stage/" }
          Copy-Item "README.md" "$stage/"
          Copy-Item "CHANGELOG.md" "$stage/"
          # Marker file = portable mode (settings and index stay next to the exe).
          "" | Out-File -FilePath "$stage/SwiftFind.portable" -Encoding ascii
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Create ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path "release-package\*" -DestinationPath "SwiftFind-portable-windows.zip" -Force
          $hash = (Get-FileHash "SwiftFind-portable-windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  SwiftFind-portable-windows.zip" | Out-File "SHA256SUMS.txt" -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftFind-windows
          path: |
            SwiftFind-portable-windows.zip
            SHA256SUMS.txt
            release-package/SwiftFind.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwiftFind-portable-windows.zip
            SHA256SUMS.txt
            release-package/SwiftFind.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
